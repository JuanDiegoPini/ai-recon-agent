name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Lint for syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 .
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Scan tracked source for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Run unit tests
        run: python -m pytest --cov --cov-report=term-missing

