[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recon-agent"
version = "1.0.0"
description = "Authorization-first OSINT and lab reconnaissance agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Juan Diego Pinilla" }]
dependencies = [
  "google-genai>=2.33,<3",
  "openai>=3.40,<4",
  "paramiko>=5.1,<6",
  "python-dotenv>=1.2,<2",
  "tldextract>=5.4,<6",
]

[project.optional-dependencies]
browser = ["playwright>=1.64,<2"]
dev = [
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
ai-recon-agent = "main:main"

[tool.setuptools]
py-modules = [
  "agenteAnalisis",
  "analisis",
  "command_policy",
  "llm_utils",
  "main",
  "scope",
  "ssh_client",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "agenteAnalisis",
  "analisis",
  "command_policy",
  "llm_utils",
  "scope",
  "ssh_client",
]

[tool.ruff]
target-version = "py311"
line-length = 100

